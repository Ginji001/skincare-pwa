<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F4A8A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="スキンケア帳">
<title>スキンケア帳</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3FB; --paper:#FFFFFF; --ink:#1C2A4A; --sub:#5B6B8C; --line:#D5DFEF;
  --blue:#2F4A8A; --blue-soft:#DCE7FA; --am:#F2B84B; --pm:#5A6FD6; --warn:#C2410C; --warn-bg:#FFF1E6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1628; --paper:#18223A; --ink:#E6ECF8; --sub:#9AA9C7; --line:#2A3858;
  --blue:#8FB0F2; --blue-soft:#24345A; --warn:#FDBA74; --warn-bg:#3A2616;}}
:root[data-theme="dark"]{--bg:#0F1628; --paper:#18223A; --ink:#E6ECF8; --sub:#9AA9C7; --line:#2A3858;
  --blue:#8FB0F2; --blue-soft:#24345A; --warn:#FDBA74; --warn-bg:#3A2616;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
main{max-width:640px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:1.5rem;margin:8px 0 2px;letter-spacing:.02em}
h2{font-size:1.15rem;margin:24px 0 10px}
.muted{color:var(--sub);font-size:.9rem}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs button{flex:1;max-width:160px;border:0;background:none;padding:10px 4px 12px;font-size:.85rem;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button[aria-current="page"]{color:var(--blue);font-weight:700}
nav.tabs svg{width:24px;height:24px}
.panel{background:var(--paper);border-radius:18px;padding:14px 16px;margin:10px 0;border:1px solid var(--line)}
.slot-h{display:flex;align-items:center;gap:10px;margin:0 0 6px;font-weight:700}
.dot{width:12px;height:12px;border-radius:50%}
.am .dot{background:var(--am)} .pm .dot{background:var(--pm)}
ol.steps{list-style:none;margin:0;padding:0}
ol.steps li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
ol.steps li:first-child{border-top:0}
.num{flex:none;width:26px;text-align:center;color:var(--sub);font-size:.85rem}
.name{flex:1;min-width:0}
.name small{display:block;color:var(--sub);font-size:.78rem}
.paused .name{opacity:.45;text-decoration:line-through}
input[type=checkbox].big{width:26px;height:26px;accent-color:var(--blue)}
li.done .name{color:var(--sub)}
.iconbtn{border:1px solid var(--line);background:var(--bg);border-radius:10px;min-width:36px;height:36px;cursor:pointer}
.btn{border:0;background:var(--blue);color:var(--paper);border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--blue-soft);color:var(--blue)}
.btn.danger{background:var(--warn-bg);color:var(--warn)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.days{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
.days button{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-weight:700}
.days button[aria-pressed="true"]{background:var(--blue);color:var(--paper);border-color:var(--blue)}
.days button.today{box-shadow:0 0 0 2px var(--am)}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:.9rem}
.warn b{display:block}
.prog{height:8px;border-radius:8px;background:var(--blue-soft);overflow:hidden;margin:8px 0 0}
.prog i{display:block;height:100%;background:var(--blue);transition:width .3s}
.chip{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:99px;background:var(--blue-soft);color:var(--blue);margin:2px 4px 0 0}
.chip.off{background:var(--warn-bg);color:var(--warn)}
.cat-h{font-size:.9rem;color:var(--sub);margin:18px 0 4px}
.prod{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.prod:first-of-type{border-top:0}
label.f{display:block;margin:12px 0 4px;font-size:.9rem;color:var(--sub)}
input.t,select.t,textarea.t{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags label{border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:.85rem;cursor:pointer;background:var(--bg)}
.tags input{margin:0 4px 0 0;accent-color:var(--blue)}
dialog{border:0;border-radius:20px;padding:0;width:min(560px,94vw);max-height:88vh;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,40,.45)}
dialog .inner{padding:18px;overflow:auto;max-height:88vh}
.empty{text-align:center;padding:28px 10px;color:var(--sub)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.hero .date{font-size:2.4rem;font-weight:700;line-height:1;color:var(--blue)}
:focus-visible{outline:3px solid var(--am);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>
<dialog id="dlg"><div class="inner" id="dlgInner"></div></dialog>

<script>
const DAYS=['日','月','火','水','木','金','土'];
const CATS=['クレンジング・洗顔','化粧水','美容液','マスク','乳液・クリーム','UV・日中用','医薬品・その他'];
const TAGS=['レチノール等ビタミンA','AHA/BHA・ピーリング','ビタミンC','ナイアシンアミド','過酸化ベンゾイル','スクラブ','美白有効成分','ハイドロキノン','処方薬','香料あり'];
// 一般に同時使用で刺激が出やすいとされる組み合わせ（目安）
const RISKY=[
 ['レチノール等ビタミンA','AHA/BHA・ピーリング'],
 ['レチノール等ビタミンA','過酸化ベンゾイル'],
 ['レチノール等ビタミンA','スクラブ'],
 ['AHA/BHA・ピーリング','スクラブ'],
];
const KEY='skincare-pwa-v1';
let S=load();
let tab='today', selDay=new Date().getDay();

function blank(){const r={};for(let d=0;d<7;d++)r[d]={am:[],pm:[]};return{products:[],routine:r,checks:{},theme:'auto'}}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.products)return v}catch(e){}return blank()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('この端末では保存できませんでした。バックアップを書き出してください。')}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=id=>S.products.find(p=>p.id===id);
const uid=()=>Math.random().toString(36).slice(2,10);
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function applyTheme(){document.documentElement.dataset.theme=S.theme==='auto'?'':S.theme;if(S.theme==='auto')delete document.documentElement.dataset.theme}

const ICON={
 today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 week:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
 prod:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 2h6v4H9zM7 6h10l1 15H6z"/></svg>',
 set:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'};

function renderTabs(){
 const t=[['today','今日'],['week','ルーティン'],['prod','製品'],['set','設定']];
 document.getElementById('tabs').innerHTML=t.map(([k,l])=>`<button data-tab="${k}" ${tab===k?'aria-current="page"':''}>${ICON[k]}${l}</button>`).join('');
}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.tab;render();scrollTo(0,0)}};

function warnings(ids,slot){
 const out=[];const active=ids.map(P).filter(p=>p&&!p.paused);
 const byTag={};active.forEach(p=>(p.tags||[]).forEach(t=>(byTag[t]=byTag[t]||[]).push(p.name)));
 for(const [a,b] of RISKY) if(byTag[a]&&byTag[b]) out.push(`「${a}」（${byTag[a].join('、')}）と「${b}」（${byTag[b].join('、')}）が同じ時間帯にあります。刺激が出やすい組み合わせとされています。`);
 for(const t of ['レチノール等ビタミンA','AHA/BHA・ピーリング','ナイアシンアミド','ビタミンC','美白有効成分'])
   if(byTag[t]&&byTag[t].length>1) out.push(`「${t}」を含む製品が${byTag[t].length}つ重なっています（${byTag[t].join('、')}）。`);
 if(slot==='am'&&byTag['レチノール等ビタミンA']) out.push('ビタミンA系が朝に入っています。夜の使用が一般的です。');
 active.forEach(p=>{(p.avoid||[]).forEach(oid=>{const o=P(oid);if(o&&!o.paused&&ids.includes(oid)&&p.id<oid)out.push(`自分で登録した「一緒に使わない」組み合わせ：${p.name} と ${o.name}`)})});
 return out;
}
const warnHTML=w=>w.map(x=>`<div class="warn" role="note">${esc(x)}</div>`).join('');

function stepsHTML(d,slot,checkable){
 const ids=S.routine[d][slot];
 if(!ids.length) return `<p class="muted">まだ製品がありません${checkable?'。「ルーティン」タブで追加できます。':''}</p>`;
 const ck=S.checks[todayKey()]?.[slot]||[];
 return `<ol class="steps">${ids.map((id,i)=>{const p=P(id);if(!p)return'';const done=ck.includes(id);
  return `<li class="${p.paused?'paused':''} ${done?'done':''}">
   <span class="num">${i+1}</span>
   <span class="name">${esc(p.name)}${p.paused?'<small>休止中のためスキップ</small>':p.note?`<small>${esc(p.note)}</small>`:''}</span>
   ${checkable&&!p.paused?`<input type="checkbox" class="big" data-ck="${slot}" data-id="${id}" ${done?'checked':''} aria-label="${esc(p.name)}を使った">`:''}
   ${!checkable?`<button class="iconbtn" data-mv="${slot}|${i}|-1" aria-label="上へ">↑</button><button class="iconbtn" data-mv="${slot}|${i}|1" aria-label="下へ">↓</button><button class="iconbtn" data-rm="${slot}|${i}" aria-label="外す">×</button>`:''}
  </li>`}).join('')}</ol>`;
}

function viewToday(){
 const d=new Date(),wd=d.getDay();
 const cnt=s=>S.routine[wd][s].filter(id=>P(id)&&!P(id).paused).length;
 const ck=S.checks[todayKey()]||{};
 const total=cnt('am')+cnt('pm'),done=(ck.am||[]).length+(ck.pm||[]).length;
 const slot=(s,label)=>`<section class="panel ${s}"><div class="slot-h"><span class="dot"></span>${label}</div>
   ${warnHTML(warnings(S.routine[wd][s],s))}${stepsHTML(wd,s,true)}</section>`;
 if(!S.products.length) return `<h1>スキンケア帳</h1><div class="panel empty"><p>使っている化粧品を登録して、曜日ごとの朝・夜の手順を作りましょう。</p><button class="btn" data-go="prod">製品を登録する</button><p><button class="btn ghost" data-sample>サンプルで試す</button></p></div>`;
 return `<div class="hero"><div><div class="muted">${d.getMonth()+1}月${d.getDate()}日</div><div class="date">${DAYS[wd]}曜日</div></div>
  <div class="muted">${done}/${total} 完了</div></div>
  <div class="prog"><i style="width:${total?done/total*100:0}%"></i></div>
  ${slot('am','朝')}${slot('pm','夜')}`;
}

function viewWeek(){
 const slot=(s,label)=>`<section class="panel ${s}"><div class="slot-h"><span class="dot"></span>${label}</div>
  ${warnHTML(warnings(S.routine[selDay][s],s))}${stepsHTML(selDay,s,false)}
  <div class="row" style="margin-top:10px"><button class="btn ghost" data-add="${s}">製品を追加</button></div></section>`;
 const tw=new Date().getDay();
 return `<h1>ルーティン</h1><p class="muted">曜日を選んで、朝と夜に使う順番を決めます。</p>
  <div class="days" role="group" aria-label="曜日">${DAYS.map((l,i)=>`<button aria-pressed="${i===selDay}" class="${i===tw?'today':''}" data-day="${i}">${l}</button>`).join('')}</div>
  ${slot('am','朝')}${slot('pm','夜')}
  <div class="row"><button class="btn ghost" data-copy>この曜日を他の曜日にコピー</button></div>`;
}

function viewProd(){
 const used=id=>{let n=0;for(let d=0;d<7;d++)n+=S.routine[d].am.includes(id)+S.routine[d].pm.includes(id);return n};
 const list=CATS.map(c=>{const ps=S.products.filter(p=>p.cat===c);if(!ps.length)return'';
  return `<div class="cat-h">${c}</div><div class="panel">${ps.map(p=>`<div class="prod" data-edit="${p.id}" tabindex="0" role="button">
   <div class="name">${esc(p.name)}<small>週${used(p.id)}回${p.opened?`　開封 ${esc(p.opened)}`:''}</small>
   <div>${p.paused?'<span class="chip off">休止中</span>':''}${(p.tags||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div></div></div>`).join('')}</div>`}).join('');
 return `<h1>製品</h1><div class="row"><button class="btn" data-new>製品を追加</button></div>
  ${list||'<div class="panel empty">まだ製品がありません。</div>'}`;
}

function viewSet(){
 return `<h1>設定</h1>
 <section class="panel"><h2 style="margin-top:0">表示</h2>
  <select class="t" id="theme"><option value="auto">端末に合わせる</option><option value="light">ライト</option><option value="dark">ダーク</option></select></section>
 <section class="panel"><h2 style="margin-top:0">バックアップ</h2>
  <p class="muted">データはこの端末のブラウザ内だけに保存されます。機種変更やブラウザのデータ削除の前に書き出してください。</p>
  <div class="row"><button class="btn ghost" data-export>書き出す（JSON）</button><label class="btn ghost" style="cursor:pointer">読み込む<input type="file" accept="application/json" id="imp" hidden></label></div></section>
 <section class="panel"><h2 style="margin-top:0">注意表示について</h2>
  <p class="muted">成分タグをもとに、一般に刺激が出やすいとされる組み合わせや同じ成分の重なりを表示します。医療的な判断ではありません。処方薬の使い方は医師・薬剤師の指示に従ってください。</p></section>
 <section class="panel"><h2 style="margin-top:0">初期化</h2><button class="btn danger" data-reset>すべてのデータを消す</button></section>`;
}

function render(){renderTabs();applyTheme();
 const v={today:viewToday,week:viewWeek,prod:viewProd,set:viewSet}[tab]();
 document.getElementById('app').innerHTML=v;
 const th=document.getElementById('theme');if(th){th.value=S.theme;th.onchange=()=>{S.theme=th.value;save();render()}}
 const imp=document.getElementById('imp');if(imp)imp.onchange=importFile;
}

document.getElementById('app').addEventListener('click',e=>{
 const t=e.target.closest('[data-go],[data-sample],[data-day],[data-add],[data-mv],[data-rm],[data-copy],[data-new],[data-edit],[data-export],[data-reset]');if(!t)return;
 const ds=t.dataset;
 if(ds.go){tab=ds.go;render()}
 else if('sample' in ds){loadSample()}
 else if(ds.day){selDay=+ds.day;render()}
 else if(ds.add){pickProduct(ds.add)}
 else if(ds.mv){const[s,i,dir]=ds.mv.split('|');const a=S.routine[selDay][s],j=+i+ +dir;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()}
 else if(ds.rm){const[s,i]=ds.rm.split('|');S.routine[selDay][s].splice(+i,1);save();render()}
 else if('copy' in ds){copyDay()}
 else if('new' in ds){editProduct(null)}
 else if(ds.edit){editProduct(ds.edit)}
 else if('export' in ds){exportData()}
 else if('reset' in ds){if(confirm('製品・ルーティン・記録をすべて消します。元に戻せません。')){S=blank();save();render()}}
});
document.getElementById('app').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.edit)editProduct(e.target.dataset.edit)});
document.getElementById('app').addEventListener('change',e=>{const c=e.target;if(!c.dataset.ck)return;
 const k=todayKey();S.checks[k]=S.checks[k]||{am:[],pm:[]};const a=S.checks[k][c.dataset.ck];
 if(c.checked){if(!a.includes(c.dataset.id))a.push(c.dataset.id)}else a.splice(a.indexOf(c.dataset.id),1);
 // 30日より前の記録は削除
 const keys=Object.keys(S.checks);if(keys.length>30)keys.slice(0,keys.length-30).forEach(x=>delete S.checks[x]);
 save();render()});

const dlg=document.getElementById('dlg'),dlgIn=document.getElementById('dlgInner');
function openDlg(html){dlgIn.innerHTML=html;dlg.showModal()}
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});

function pickProduct(slot){
 const ps=S.products.filter(p=>!S.routine[selDay][slot].includes(p.id));
 if(!S.products.length){tab='prod';render();return}
 openDlg(`<h2 style="margin-top:0">${DAYS[selDay]}曜日の${slot==='am'?'朝':'夜'}に追加</h2>
  ${ps.length?CATS.map(c=>{const x=ps.filter(p=>p.cat===c);return x.length?`<div class="cat-h">${c}</div>`+x.map(p=>`<button class="btn ghost" style="display:block;width:100%;text-align:left;margin:6px 0" data-pick="${p.id}">${esc(p.name)}${p.paused?'（休止中）':''}</button>`).join(''):''}).join(''):'<p class="muted">登録済みの製品はすべて入っています。</p>'}
  <div class="row" style="margin-top:14px"><button class="btn" data-close>閉じる</button></div>`);
 dlgIn.onclick=e=>{const b=e.target.closest('[data-pick],[data-close]');if(!b)return;
  if(b.dataset.pick){S.routine[selDay][slot].push(b.dataset.pick);save();render();pickProduct(slot)}else dlg.close()};
}

function editProduct(id){
 const p=id?P(id):{id:uid(),name:'',cat:CATS[2],tags:[],note:'',opened:'',paused:false,avoid:[]};
 const others=S.products.filter(o=>o.id!==p.id);
 openDlg(`<h2 style="margin-top:0">${id?'製品を編集':'製品を追加'}</h2>
  <label class="f" for="pn">製品名</label><input class="t" id="pn" value="${esc(p.name)}" placeholder="例：〇〇 化粧水 しっとり">
  <label class="f" for="pc">種類</label><select class="t" id="pc">${CATS.map(c=>`<option ${c===p.cat?'selected':''}>${c}</option>`).join('')}</select>
  <label class="f">含まれる主な成分（注意表示に使います）</label>
  <div class="tags">${TAGS.map(t=>`<label><input type="checkbox" name="tg" value="${t}" ${p.tags.includes(t)?'checked':''}>${t}</label>`).join('')}</div>
  <label class="f" for="pno">使い方メモ</label><input class="t" id="pno" value="${esc(p.note)}" placeholder="例：2〜3滴、乾燥する部分だけ">
  <label class="f" for="po">開封日</label><input class="t" type="date" id="po" value="${esc(p.opened)}">
  ${others.length?`<label class="f">一緒に使わない製品</label><div class="tags">${others.map(o=>`<label><input type="checkbox" name="av" value="${o.id}" ${(p.avoid||[]).includes(o.id)||(o.avoid||[]).includes(p.id)?'checked':''}>${esc(o.name)}</label>`).join('')}</div>`:''}
  <label class="f"><input type="checkbox" id="pp" ${p.paused?'checked':''}> 休止中（ルーティンに残したまま、今日の手順ではスキップ）</label>
  <div class="row" style="margin-top:16px"><button class="btn" data-sv>保存</button><button class="btn ghost" data-cl>キャンセル</button>${id?'<button class="btn danger" data-del>削除</button>':''}</div>`);
 dlgIn.onclick=e=>{const b=e.target.closest('[data-sv],[data-cl],[data-del]');if(!b)return;
  if('cl' in b.dataset){dlg.close();return}
  if('del' in b.dataset){if(!confirm(`「${p.name}」を削除し、すべての曜日から外します。`))return;
   S.products=S.products.filter(x=>x.id!==p.id);for(let d=0;d<7;d++)for(const s of['am','pm'])S.routine[d][s]=S.routine[d][s].filter(x=>x!==p.id);
   S.products.forEach(o=>o.avoid=(o.avoid||[]).filter(x=>x!==p.id));save();dlg.close();render();return}
  const name=document.getElementById('pn').value.trim();if(!name){document.getElementById('pn').focus();return}
  p.name=name;p.cat=document.getElementById('pc').value;p.note=document.getElementById('pno').value.trim();
  p.opened=document.getElementById('po').value;p.paused=document.getElementById('pp').checked;
  p.tags=[...dlgIn.querySelectorAll('[name=tg]:checked')].map(x=>x.value);
  p.avoid=[...dlgIn.querySelectorAll('[name=av]:checked')].map(x=>x.value);
  S.products.forEach(o=>{if(o.id!==p.id)o.avoid=(o.avoid||[]).filter(x=>x!==p.id)});
  if(!id)S.products.push(p);save();dlg.close();render()};
}

function copyDay(){
 openDlg(`<h2 style="margin-top:0">${DAYS[selDay]}曜日の朝・夜をコピー</h2><p class="muted">選んだ曜日の手順は上書きされます。</p>
  <div class="tags">${DAYS.map((l,i)=>i===selDay?'':`<label><input type="checkbox" name="cd" value="${i}">${l}</label>`).join('')}</div>
  <div class="row" style="margin-top:16px"><button class="btn" data-ok>コピー</button><button class="btn ghost" data-cl>キャンセル</button></div>`);
 dlgIn.onclick=e=>{const b=e.target.closest('[data-ok],[data-cl]');if(!b)return;
  if('ok' in b.dataset){dlgIn.querySelectorAll('[name=cd]:checked').forEach(x=>{S.routine[x.value]={am:[...S.routine[selDay].am],pm:[...S.routine[selDay].pm]}});save();render()}
  dlg.close()};
}

function exportData(){
 const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`スキンケア帳_${new Date().toISOString().slice(0,10)}.json`;a.click();
 toast('書き出しました。保存されない場合は、自分で公開したPWA版から書き出してください。');
}
function importFile(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const v=JSON.parse(r.result);if(!v.products||!v.routine)throw 0;S=v;save();render();toast('読み込みました')}catch(_){toast('このファイルは読み込めません。スキンケア帳で書き出したJSONを選んでください。')}};r.readAsText(f)}

function loadSample(){
 const mk=(name,cat,tags=[],note='')=>({id:uid(),name,cat,tags,note,opened:'',paused:false,avoid:[]});
 const w=mk('やさしい洗顔フォーム','クレンジング・洗顔'),l=mk('保湿化粧水','化粧水'),c=mk('ビタミンC美容液','美容液',['ビタミンC']),
  n=mk('ナイアシンアミド美容液','美容液',['ナイアシンアミド']),r=mk('レチノールクリーム','乳液・クリーム',['レチノール等ビタミンA'],'米粒大から'),
  a=mk('角質ケア美容液','美容液',['AHA/BHA・ピーリング']),m=mk('保湿クリーム','乳液・クリーム'),u=mk('日焼け止め SPF50+','UV・日中用');
 S.products=[w,l,c,n,r,a,m,u];
 for(let d=0;d<7;d++){S.routine[d].am=[l.id,c.id,m.id,u.id];S.routine[d].pm=[w.id,l.id,(d%2?n.id:r.id),m.id]}
 S.routine[6].pm=[w.id,l.id,a.id,r.id,m.id];// 注意表示の例
 save();render();toast('サンプルを入れました。設定から消せます。');
}

function toast(msg){const t=document.createElement('div');t.textContent=msg;t.setAttribute('role','status');
 t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;max-width:90vw;z-index:99;font-size:.9rem';
 document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}

render();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
